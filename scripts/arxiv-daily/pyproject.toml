[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-daily"
version = "0.1.0"
description = "Daily arxiv ingestion pipeline that opens draft PRs against the ace-trump-tech knowledge-base submodules."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ace-trump-tech" }]
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.32",
  "feedparser>=6.0",
  "PyGithub>=2.3",  # optional in practice; required by github_pr
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
]

[project.scripts]
arxiv-daily = "arxiv_daily.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arxiv_daily*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"