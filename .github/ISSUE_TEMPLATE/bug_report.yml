name: Source or workflow problem
description: Report a reproducible problem with the index, links, or bootstrap workflow.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        AI may assist with search or formatting, but the author must personally verify the reproduction and answer maintainer questions. AI-only or unverifiable reports may be closed.
  - type: input
    id: scope
    attributes:
      label: Affected scope
      description: Name the submodule, path, or workflow that is affected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, commit/version, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and proposed fix
      description: Link the source or logs that support the report. If you can fix it, open a PR instead.
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Author verification
      options:
        - label: I personally ran the reproduction and can provide additional logs or context.
          required: true
        - label: I searched existing Issues and this is not a duplicate.
          required: true
