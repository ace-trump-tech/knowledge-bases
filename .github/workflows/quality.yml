name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Validate shell scripts
        run: bash -n scripts/bootstrap.sh
      - name: Validate catalog and submodule pins
        run: python3 scripts/validate_catalog.py
      - name: Check whitespace errors
        run: git diff --check
