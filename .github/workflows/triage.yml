name: Issue triage

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = {
              'needs-triage': ['fbca04', 'Maintainer has not verified the report yet'],
              'needs-more-info': ['d93f0b', 'Report needs reproducible evidence'],
              'bug': ['d73a4a', 'Reproducible workflow or infrastructure defect'],
              'content-correction': ['0075ca', 'Correction to a source or summary'],
              'new-entry': ['0e8a16', 'Proposal for a new knowledge entry'],
              'broken-link': ['5319e7', 'A stale or inaccessible link']
            };
            for (const [name, [color, description]] of Object.entries(labels)) {
              try {
                await github.rest.issues.getLabel({owner: context.repo.owner, repo: context.repo.repo, name});
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, name, color, description});
              }
            }
            const title = context.payload.issue.title.toLowerCase();
            const type = title.match(/^\[(bug|source|entry|link)\]/)?.[1];
            const typeLabel = {bug: 'bug', source: 'content-correction', entry: 'new-entry', link: 'broken-link'}[type];
            await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: ['needs-triage', ...(typeLabel ? [typeLabel] : [])]});
